name: Build bootstrap archives (com.termuxg)

on:
  workflow_dispatch:
    inputs:
      add_packages:
        description: "Extra packages (comma separated, e.g. openssh,git). Empty = default."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Verify package name
        run: grep -n '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh

      - name: Probe apt source download
        run: |
          exp=$(grep '^TERMUX_PKG_SHA256=' packages/apt/build.sh | cut -d= -f2)
          url=https://salsa.debian.org/apt-team/apt/-/archive/2.8.1/apt-2.8.1.tar.bz2
          for i in $(seq 1 10); do
            curl -sL --http1.1 -o /tmp/apt.tbz2 "$url" || true
            h=$(sha256sum /tmp/apt.tbz2 | cut -d' ' -f1)
            echo "try $i: $(stat -c%s /tmp/apt.tbz2) bytes $h"
            [ "$h" = "$exp" ] && exit 0
            sleep 15
          done
          echo "salsa keeps truncating the archive"; exit 1

      - name: Build builder docker image for com.termuxg
        run: |
          for i in 1 2 3; do
            docker build -t termuxg-package-builder -f scripts/Dockerfile scripts && exit 0
            echo "retry $i"; sleep 60
          done
          exit 1

      - name: Build bootstrap (${{ matrix.arch }})
        env:
          TERMUX_BUILDER_IMAGE_NAME: termuxg-package-builder
        run: |
          set -o pipefail
          find . -name "*.sh" -exec chmod +x {} +
          extra=""
          if [ -n "${{ inputs.add_packages }}" ]; then extra="--add ${{ inputs.add_packages }}"; fi
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures ${{ matrix.arch }} $extra 2>&1 | tee build.log

      - name: Locate bootstrap zip
        if: always()
        run: |
          echo "--- workspace ---"; ls -la | head -40
          echo "--- search ---"
          find / -name 'bootstrap-*.zip' -not -path '/proc/*' 2>/dev/null | head
          z=$(find / -name 'bootstrap-${{ matrix.arch }}.zip' -not -path '/proc/*' 2>/dev/null | head -1)
          if [ -n "$z" ] && [ "$z" != "$PWD/bootstrap-${{ matrix.arch }}.zip" ]; then cp "$z" .; fi
          ls -lh bootstrap-*.zip || true
          echo "--- build.log markers ---"
          grep -n "Creating 'bootstrap\|Finished successfully\|No debs found" build.log | tail -5 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.arch }}
          path: bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: bootstrap-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum bootstrap-*.zip | tee SHA256SUMS
          tag="bootstrap-termuxg-$(date +%Y.%m.%d)-r${{ github.run_number }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "Bootstrap archives for com.termuxg" \
            --notes "$(cat SHA256SUMS)" \
            bootstrap-*.zip SHA256SUMS
